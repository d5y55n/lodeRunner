# Ubuntu sites-enabled is included within the http context.
limit_req_zone $binary_remote_addr zone=loderunner_requests:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=loderunner_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/loderunner.access.log;
    error_log /var/log/nginx/loderunner.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No static alias to the project or data directory: SQLite/secrets stay private.
    location / {
        limit_req zone=loderunner_requests burst=40 nodelay;
        limit_req_status 429;
        limit_conn loderunner_connections 12;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A single trusted edge: discard untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
