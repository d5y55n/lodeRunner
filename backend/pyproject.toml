[project]
name = "sr-probability-trading-backend"
version = "0.1.0"
description = "Phase 1 market data backend for the SR Probability Trading Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
download-klines = "app.market.data_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
